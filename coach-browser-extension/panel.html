<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevSpace Agent Observer</title>
<style>
:root{color-scheme:light dark;font:13px system-ui}body{margin:0;background:Canvas;color:CanvasText}header{padding:14px;border-bottom:1px solid GrayText;position:sticky;top:0;background:Canvas}h1{font-size:16px;margin:0 0 7px}h2{font-size:13px}small,.muted{color:GrayText}main{padding:10px 14px}section{margin-bottom:18px}ul,ol{list-style:none;margin:0;padding:0}li{padding:9px;margin:7px 0;border:1px solid color-mix(in srgb,CanvasText 16%,transparent);border-radius:8px;overflow-wrap:anywhere}.row{display:flex;gap:8px;justify-content:space-between;align-items:center}.status{font-weight:700}button{background:ButtonFace;color:ButtonText;border:1px solid GrayText;border-radius:7px;padding:5px 9px;cursor:pointer}#note{font-size:11px;color:GrayText;margin-top:6px}.tag{font-weight:650}.time{color:GrayText;font-size:11px}.detail{margin-top:4px;font-size:11px;color:GrayText}
</style></head><body><header><h1>DevSpace · Agent 观察面板</h1><small>本地 Codex CLI · 只读 · 不访问 ChatGPT 内容</small><div class="row"><span id="state" class="status" role="status">连接中</span><button id="pause">暂停更新</button></div><div id="note" aria-live="polite"></div></header>
<main><section><h2>最近任务</h2><ul id="tasks"></ul></section><section id="audit" aria-live="polite"><h2>任务效率审计</h2><div id="auditSummary" class="detail">选择任务后读取离线审计结果（仅本地）。</div><ul id="auditFindings"></ul><details><summary>审计证据与覆盖范围</summary><ul id="auditEvidence"></ul></details></section><section><h2>实时工具轨迹</h2><ol id="events"></ol></section></main><script src="panel.js"></script></body></html>
