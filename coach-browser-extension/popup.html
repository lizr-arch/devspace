<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevSpace Coach Watch · 配对版</title>
<style>
body{font-family:system-ui,sans-serif;width:330px;padding:16px;margin:0;color:#1c2834}
h1{font-size:16px;margin:0 0 8px}
p,label{font-size:12px;line-height:1.5;color:#526275}
label{display:block;margin-top:8px}
input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #b7c2cc;border-radius:6px}
button{padding:8px;cursor:pointer;border:1px solid #b7c2cc;border-radius:6px;background:#fff;margin:5px 3px 0 0}
#tasks{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f3f6;border-radius:6px;padding:10px;font-size:12px}
#status,#feedback{font-size:12px}
#extension-id{user-select:all;overflow-wrap:anywhere}
</style></head>
<body><h1>DevSpace · 审核队列</h1>
<p>扩展 ID：<span id="extension-id">—</span></p>
<p>先用这个扩展 ID 启动已授权的 DevSpace Sidecar，再粘贴一次性配对令牌。令牌只保存在浏览器的当前会话中。</p>
<label for="port">本机端口</label><input id="port" type="number" min="1" max="65535" value="8765">
<label for="token">配对令牌</label><input id="token" type="password" autocomplete="off" placeholder="粘贴一次性令牌">
<button id="pair">配对</button><button id="unpair">清除配对</button>
<p id="status" role="status">读取中…</p>
<pre id="tasks">—</pre>
<button id="refresh">刷新</button><button id="copy">复制审核指令</button>
<p id="feedback" aria-live="polite"></p>
<p>不会自动向 ChatGPT 发送消息，也不会读取 ChatGPT 对话内容。</p>
<script src="popup.js"></script>
</body></html>
